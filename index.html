}

<body>
<header>
 <div class="top">
  <h1><span>Copa de Seleções · 2º semestre 2026 <small id="sub"></small></span></h1>
  <input id="q" class="q" placeholder="Buscar time" autocomplete="off">
  <label class="mut" style="color:#fff">Meu time:
   <select id="meu"></select></label>
  <button id="tema" class="tbtn" aria-label="Alternar tema: automático, claro ou escuro" title="Tema"></button>
 </div>
 <nav id="nav"></nav>
</header>
<div class="stripwrap"><div class="strip" id="strip"></div></div>
<div id="enqbar"></div>
<div class="jg" id="jg"></div>
<main id="app"></main>
<div id="fab"></div><div id="toast"></div><div id="orgm"></div><nav id="bnav"></nav><div id="sheet"></div>
<footer id="foot"></footer>

<script src="dados.js"></script>
<script>
const TABS=[["inicio","Início"],["tabela","Tabela"],["jogos","Jogos"],["cartoes","Cartões"],["calc","Calculadora"],["fase","Fase final"],["votar","Votação"],["mural","Mural"],["notas","Notas"]];
if(DATA.votacao&&DATA.votacao.oculta){const i=TABS.findIndex(t=>t[0]==='votar');if(i>=0)TABS.splice(i,1)}
if(!(DATA.votacao&&DATA.votacao.url)||DATA.votacao.oculta){const i=TABS.findIndex(t=>t[0]==='mural');if(i>=0)TABS.splice(i,1)}
const $=s=>document.querySelector(s);
let aba="inicio",meu="";
const st={get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
meu=st.get("meuTime")||"";
const fmt=d=>{const[a,m,dd]=d.split("-");return dd+"/"+m};
const dow=d=>["dom","seg","ter","qua","qui","sex","sáb"][new Date(d+"T12:00:00").getDay()];
const ord=(a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora);

function tabela(){
 if(DATA.classificacao)return DATA.classificacao.map(r=>({n:r[0],p:r[1],j:r[2],v:r[3],e:r[4],d:r[5],gp:r[6],gc:r[7],sg:r[6]-r[7]}));
 const t={};DATA.times.forEach(n=>t[n]={n,j:0,v:0,e:0,d:0,gp:0,gc:0});
 DATA.jogos.filter(j=>j.placar&&!j.fase).forEach(j=>{
  const[a,b]=j.placar;const c=t[j.casa],f=t[j.fora];if(!c||!f)return;
  c.j++;f.j++;c.gp+=a;c.gc+=b;f.gp+=b;f.gc+=a;
  if(a>b){c.v++;f.d++}else if(a<b){f.v++;c.d++}else{c.e++;f.e++}
 });
 return Object.values(t).map(x=>({...x,p:x.v*3+x.e,sg:x.gp-x.gc}))
  .sort((a,b)=>b.p-a.p||b.v-a.v||b.sg-a.sg||b.gp-a.gp||a.n.localeCompare(b.n));
}
function tabHTML(hl=meu){
 const r=tabela();
 return `<div class="wrap"><table><tr><th>#</th><th>Time</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th></tr>`+
 r.map((x,i)=>`<tr class="${x.n===hl?"me":""}"><td>${i+1}</td><td>${x.n}</td><td><b>${x.p}</b></td><td>${x.j}</td><td>${x.v}</td><td>${x.e}</td><td>${x.d}</td><td>${x.gp}</td><td>${x.gc}</td><td>${x.sg}</td></tr>`).join("")+
 `</table></div><p class="mut">Classificação calculada a partir dos resultados do site oficial (consulta de 22/10/2026) e dos placares informados manualmente depois dessa data. Pontuação 3-1-0 e desempate (1º número de vitórias, depois saldo e gols pró), como informado: não estão no regulamento.</p>`;
}
function rankHip(map){const t={};DATA.times.forEach(n=>t[n]={n,j:0,v:0,e:0,d:0,gp:0,gc:0});
 DATA.jogos.filter(j=>!j.fase).forEach(j=>{const pl=j.placar||map[j.n];if(!pl)return;const a=pl[0],b=pl[1],c=t[j.casa],f=t[j.fora];if(!c||!f)return;
  c.j++;f.j++;c.gp+=a;c.gc+=b;f.gp+=b;f.gc+=a;if(a>b){c.v++;f.d++}else if(a<b){f.v++;c.d++}else{c.e++;f.e++}});
 return Object.values(t).map(x=>({...x,p:x.v*3+x.e,sg:x.gp-x.gc})).sort((a,b)=>b.p-a.p||b.v-a.v||b.sg-a.sg||b.gp-a.gp||a.n.localeCompare(b.n))}
function provJogos(){const G=DATA.jogos.filter(j=>!j.fase);if(!G.length||DATA.jogos.some(j=>j.fase))return[];
 const pd=G.filter(j=>!j.placar);if(!pd.length||pd.length>4)return[];
 const alts=[[0,0],[1,0],[0,1],[9,0],[0,9]],cand=Array.from({length:DATA.times.length},()=>new Set());
 const go=(i,m)=>{if(i===pd.length){rankHip(m).forEach((x,k)=>cand[k].add(x.n));return}alts.forEach(a=>{m[pd[i].n]=a;go(i+1,m)})};go(0,{});
 const dep=pd.map(j=>nome(j.casa)+' x '+nome(j.fora)).join(', ');
 return FASE.map(f=>{const A=[...cand[f.a]],B=[...cand[f.b]];
  return{n:f.n,data:f.data,hora:f.hora,fase:true,prov:true,dep,pa:f.a+1,pb:f.b+1,casa:A.length===1?A[0]:null,fora:B.length===1?B[0]:null,A,B,
   ca:A.map(nome).join(', '),cb:B.map(nome).join(', ')}})}
function jogoProv(j){const me=j.casa===meu||j.fora===meu,lado=(n,p,c,dir)=>n?(dir?`${n} ${bdg(n,'sm')}`:`${bdg(n,'sm')} ${n}`)+` <small class='mut'>${p}º</small>`:`${p}º colocado<br><small class='mut'>${c.replace(/, ([^,]*)$/,' ou $1')}</small>`;
 return `<div class="jogo ${me?'me':''}"><div class="t">${lado(j.casa,j.pa,j.ca,0)}</div><div class="p">× </div><div class="t">${lado(j.fora,j.pb,j.cb,1)}</div><div class="d">${dow(j.data)} ${fmt(j.data)} · ${j.hora} · playoff · jogo ${j.n} · a confirmar após ${j.dep}</div></div>`}
function jogoHTML(j){
 if(j.prov)return jogoProv(j);
 const me=j.casa===meu||j.fora===meu;
 return `<div class="jogo ${me?"me":""}"><div class="t ${j.casa===meu?"m":""}">${bdg(j.casa,"sm")} ${j.casa}</div><div class="p">${j.placar?j.placar[0]+" × "+j.placar[1]:j.vivo?`<span style="color:#d00">● ${j.vivo[0]} × ${j.vivo[1]}</span>`:"× "}</div><div class="t ${j.fora===meu?"m":""}">${j.fora} ${bdg(j.fora,"sm")}</div><div class="d">${dow(j.data)} ${fmt(j.data)} · ${j.hora} · ${j.fase?'playoff · ':''}jogo ${j.n}${!j.placar&&new Date(j.data+"T"+j.hora)<new Date()?" · aguardando resultado":""}</div>${aba==="jogos"?enqueteHTML(j):""}</div>`;
}
const jogosHTML=l=>l.length?l.map(jogoHTML).join(""):`<div class="vazio">Nenhum jogo carregado.</div>`;
function proximo(){return DATA.jogos.filter(j=>!j.placar).sort(ord)[0]}
function heroHTML(){
 const j=proximo();
 if(!j)return `<div class="card hero"><h2>Grupo B</h2><div class="big">Sem jogos pendentes carregados</div></div>`;
 return `<div class="card hero"><h2>Próximo jogo do Grupo B</h2><div class="big">${j.casa} × ${j.fora}</div><div class="sub">${dow(j.data)} ${fmt(j.data)} às ${j.hora}</div></div>`;
}
function notasHTML(){
 return DATA.notas.map(n=>`<div class="news"><span class="tag">${n.tag}</span><b>${n.t}</b><span>${n.x}</span></div>`).join("");
}
const lista=(arr,vazio,f)=>arr.length?arr.map(f).join(""):`<div class="vazio">${vazio}</div>`;
function statsHTML(){
 return `<div class="card"><h2>Artilharia</h2>${lista(DATA.artilharia,"Ainda sem dados. Envie a artilharia do Grupo B no chat.",a=>`<div class="news"><b>${a.nome}</b><span>${a.time} · ${a.gols} gol(s)</span></div>`)}</div>
 <div class="card"><h2>Cartões e suspensões</h2>${lista(DATA.cartoes,"Ainda sem dados. Aqui entra quem tem 2 amarelos (risco) e quem está suspenso.",c=>`<div class="news"><b>${c.nome}</b><span>${c.time} · ${c.am} amarelo(s) · ${c.vm} vermelho(s)${c.susp?" · SUSPENSO":""}</span></div>`)}</div>`;
}
function brechasHTML(){
 const cards=DATA.brechas.map((b,i)=>`<div class="br"><h3><span class="imp ${b[3]}">${b[3]}</span> ${b[0]}</h3>
 <p><b>Problema:</b> ${b[1]}</p><p><b>Proposta:</b> ${b[2]}</p>
 <textarea data-i="${i}" placeholder="Evidência em jogo real (data, jogo, o que aconteceu)…">${st.get("ev"+i)}</textarea></div>`).join("");
 return `<div class="card"><h2>Registro de brechas</h2><p class="mut">Anote a evidência de cada ponto. Fica salva neste navegador.</p>${cards}</div>
 <div class="card"><h2>Resumo para o clube</h2><p class="mut">Gera um texto limpo com os pontos de impacto Alto e Médio.</p>
