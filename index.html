<body>
<header>
 <div class="top">
  <h1><span>Copa de Seleções · 2º semestre 2026 <small id="sub"></small></span></h1>
  <input id="q" class="q" placeholder="Buscar time" autocomplete="off">
  <label class="mut" style="color:#fff">Meu time:
   <select id="meu"></select></label>
 </div>
 <nav id="nav"></nav>
</header>
<div class="stripwrap"><div class="strip" id="strip"></div></div>
<div id="enqbar"></div>
<div class="jg" id="jg"></div>
<main id="app"></main>
<footer id="foot"></footer>

<script src="dados.js"></script>
<script>
const TABS=[["inicio","Início"],["tabela","Tabela"],["jogos","Jogos"],["cartoes","Cartões"],["calc","Calculadora"],["fase","Fase final"],["votar","Votação"],["notas","Notas"]];
if(DATA.votacao&&DATA.votacao.oculta){const i=TABS.findIndex(t=>t[0]==='votar');if(i>=0)TABS.splice(i,1)}
const $=s=>document.querySelector(s);
let aba="inicio",meu="";
const st={get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
meu=st.get("meuTime")||"";
const fmt=d=>{const[a,m,dd]=d.split("-");return dd+"/"+m};
const dow=d=>["dom","seg","ter","qua","qui","sex","sáb"][new Date(d+"T12:00:00").getDay()];
const ord=(a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora);

function tabela(){
 if(DATA.classificacao)return DATA.classificacao.map(r=>({n:r[0],p:r[1],j:r[2],v:r[3],e:r[4],d:r[5],gp:r[6],gc:r[7],sg:r[6]-r[7]}));
 const t={};DATA.times.forEach(n=>t[n]={n,j:0,v:0,e:0,d:0,gp:0,gc:0});
 DATA.jogos.filter(j=>j.placar).forEach(j=>{
  const[a,b]=j.placar;const c=t[j.casa],f=t[j.fora];if(!c||!f)return;
  c.j++;f.j++;c.gp+=a;c.gc+=b;f.gp+=b;f.gc+=a;

 else{const s=VT.sel[fm];sl.forEach((p,i)=>items.push(s[i]?{n:s[i].n,t:s[i].t}:null))}
 for(let i=0;i<sl.length;i++){const p=sl[i],it=items[i],cx=X0+W*p[1]/100,cy=Y0+H*p[2]/100;

  const lab=it?vshort(it.n)+(it.v?' · '+it.v:''):p[0];

  const tw=x.measureText(lab).width+28;rr(x,cx-tw/2,cy+36,tw,50,10,'rgba(0,0,0,.6)');T(x,lab,cx,cy+73,fs,'#fff','center',FH,700)}
 if(res)T(x,'O número ao lado do nome é a quantidade de votos',X0+30,Y0+32,22,'rgba(255,255,255,.8)','left',FB,400);
 return c}

function vComb(R){const src=R.resultado||{},ks=Object.keys(src);
 if(ks.length&&Array.isArray(src[ks[0]]))return src;
 const agg={},out={};
 ks.forEach(esq=>{const E=src[esq]||{};Object.keys(E).forEach(pos=>E[pos].forEach(c=>{const k=pos+'|'+c.jogador+'|'+c.time;agg[k]=agg[k]||{pos,jogador:c.jogador,time:c.time,votos:0};agg[k].votos+=c.votos}))});
 Object.values(agg).forEach(a=>{(out[a.pos]=out[a.pos]||[]).push({jogador:a.jogador,time:a.time,votos:a.votos})});
 Object.keys(out).forEach(k=>out[k].sort((a,b)=>b.votos-a.votos));return out}

 const lab={casa:'Vitória '+nome(j.casa),empate:'Empate',fora:'Vitória '+nome(j.fora)},pc=k=>tot?Math.round(r[k]*100/tot):0;
 const bar=k=>`<div class='eq'><span>${lab[k]}</span><div class='eb'><i style='width:${pc(k)}%'></i></div><b>${pc(k)}%</b></div>`;
 if(mv||!aberta)return `<div class='enq'><div class='eh'>Palpite do pessoal · ${tot} voto${tot===1?'':'s'}</div>${['casa','empate','fora'].map(bar).join('')}${mv?`<small>Você votou em: ${lab[mv]}</small>`:`<small>Enquete encerrada.</small>`}</div>`;
 return `<div class='enq'><div class='eh'>Quem vence? Vote e veja o palpite do pessoal</div><div class='ebt'>${['casa','empate','fora'].map(k=>`<button class='vb' data-eq='${j.n}|${k}'>${lab[k]}</button>`).join('')}</div></div>`}
